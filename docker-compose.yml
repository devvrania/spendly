services:
  postgres:
    image: postgres:17-alpine
    container_name: spendly-postgres
    environment:
      POSTGRES_USER: spendly
      POSTGRES_PASSWORD: spendly
      POSTGRES_DB: spendly_dev
    ports:
      - "5434:5432"
    volumes:
      - spendly-pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spendly -d spendly_dev"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  spendly-pgdata:
